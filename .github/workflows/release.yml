name: Release

# The Marketplace (HACS before Home Assistant 2026.11) installs the zip attached to each release
# (zip_release in hacs.json), so GitHub counts
# every download. The zip holds the files of custom_components/flight_prices at its root.
#
# Releases are immutable: once published, neither their tag nor their files can change. So the
# zip is attached while the release is a draft: pushing a tag v* creates the draft with the zip,
# and the release is published by hand after writing its notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose draft release gets the zip
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the version
        run: |
          version=$(jq -r .version custom_components/flight_prices/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "manifest.json says $version, the tag is $TAG"
            exit 1
          fi
      - name: Zip the integration
        run: cd custom_components/flight_prices && zip -r -X ../../flight_prices.zip . -x '__pycache__/*'
      - name: Attach it to a draft release
        # On a published release the upload fails: its files cannot change any more.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" flight_prices.zip --clobber
          else
            gh release create "$TAG" flight_prices.zip --draft --verify-tag --title "$TAG" --notes "To be written before publishing."
          fi

  image:
    # The app's image for amd64 and aarch64, tagged with the version in app/config.yaml: Home Assistant
    # pulls the tag that matches the version, so the image is pushed before the release is published.
    # The first push of a package to ghcr.io makes it private: it must be made public once, by hand.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/flight-prices-app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check the version
        run: |
          version=$(grep -E "^version:" app/config.yaml | sed -E 's/version: *"?([^"]*)"?/\1/')
          if [ "v$version" != "$TAG" ]; then
            echo "app/config.yaml says $version, the tag is $TAG"
            exit 1
          fi
          engine=$(sed -nE 's/^__version__ = "(.*)"/\1/p' app/flight_prices_engine/__init__.py)
          if [ "$engine" != "$version" ]; then
            echo "flight_prices_engine says $engine, app/config.yaml $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
